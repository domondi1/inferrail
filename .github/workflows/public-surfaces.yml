name: Public product surfaces

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  public-surfaces:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate product inventory and adoption links (offline)
        run: python scripts/check_public_surfaces.py
