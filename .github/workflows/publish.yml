name: Publish to PyPI

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  ci:
    # Runs the full CI workflow (lint, mypy, tests, generated-file freshness,
    # the hosted-economic-authority job, the ap-exceptions job) against the
    # exact tagged commit. Publication depends on this passing -- a version
    # bump alone is never sufficient for a release.
    uses: ./.github/workflows/ci.yml

  platform-verify:
    # Native Windows/macOS/Linux wheel-install verification (see
    # platform-verify.yml's own header) against the exact tagged commit --
    # not just Ubuntu CI. A release must never be published on the theory
    # that a platform "would obviously pass" when it was never actually
    # run for this commit.
    uses: ./.github/workflows/platform-verify.yml

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build distribution
        run: |
          python -m pip install build
          python -m build

      - name: Upload distribution
        uses: actions/upload-artifact@v4
        with:
          name: distribution
          path: dist/

  verify-wheel:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download distribution
        uses: actions/download-artifact@v4
        with:
          name: distribution
          path: dist/

      - name: Install the built wheel into a clean environment
        run: |
          python -m venv /tmp/inferrail-release-check
          /tmp/inferrail-release-check/bin/pip install "$(ls dist/*.whl)"

      - name: Run the documented AP quickstart against the installed wheel
        working-directory: /tmp
        run: |
          /tmp/inferrail-release-check/bin/inferrail ap demo
          /tmp/inferrail-release-check/bin/inferrail ap report --db inferrail-ap-demo.sqlite3 --json | python3 -m json.tool > /dev/null
          /tmp/inferrail-release-check/bin/inferrail --help
          /tmp/inferrail-release-check/bin/python3 -c "import inferrail; print('version:', inferrail.__version__)"
          /tmp/inferrail-release-check/bin/python3 -c "import inferrail.ap; print(sorted(inferrail.ap.__all__))"

  publish:
    needs: [ci, build, verify-wheel, platform-verify]
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - name: Download distribution
        uses: actions/download-artifact@v4
        with:
          name: distribution
          path: dist/

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
