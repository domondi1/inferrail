name: Publish to PyPI

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  ci:
    # Runs the full CI workflow (lint, mypy, tests, generated-file freshness,
    # the hosted-economic-authority job, the ap-exceptions job) against the
    # exact tagged commit. Publication depends on this passing -- a version
    # bump alone is never sufficient for a release.
    uses: ./.github/workflows/ci.yml

  platform-verify:
    # Native Windows/macOS/Linux wheel-install verification (see
    # platform-verify.yml's own header) against the exact tagged commit --
    # not just Ubuntu CI. A release must never be published on the theory
    # that a platform "would obviously pass" when it was never actually
    # run for this commit.
    uses: ./.github/workflows/platform-verify.yml

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Confirm tag, pyproject.toml, and server.json versions agree
        # Checked before anything is built or published, so a mismatched
        # tag can never reach PyPI and then fail at the MCP Registry step.
        run: |
          python3 -c "
          import json, sys, tomllib
          tag = sys.argv[1]
          pyproject = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']
          s = json.load(open('server.json'))
          versions = {pyproject, s['version'], *(p['version'] for p in s['packages'])}
          assert versions == {tag}, f'versions {versions} != tag {tag}'
          print('ok: tag, pyproject.toml, and server.json are all', tag)
          " "${GITHUB_REF_NAME#v}"

      # Node is required here, not just in ci.yml's own `dashboard` job:
      # `python -m build` triggers hatch_build.py's wheel-build hook,
      # which runs `npm ci && npm run build` in app/ to bundle the
      # dashboard into this exact wheel (docs/adr/0018). Without it, the
      # hook's own never-fail-the-build design (see ADR-0018) would let
      # this job silently succeed while publishing a wheel with no
      # dashboard in it -- the actual PyPI release must not depend on
      # Node happening to already be on a GitHub-hosted runner's image.
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build distribution
        run: |
          python -m pip install build
          python -m build

      - name: Confirm the built wheel bundles the dashboard
        # Publishing a wheel with no dashboard, silently, would be exactly
        # the kind of misleading gap this project's own MISSION.md
        # non-negotiables refuse to ship -- fail the release outright
        # rather than merely hoping the step above worked.
        run: |
          python3 -c "
          import zipfile, glob
          whl = glob.glob('dist/*.whl')[0]
          names = zipfile.ZipFile(whl).namelist()
          assert any(n.endswith('dashboard_static/index.html') for n in names), (
              f'{whl} does not bundle the dashboard (dashboard_static/index.html missing) -- '
              'refusing to publish a release without it.'
          )
          print('ok: wheel bundles the dashboard:', whl)
          "

      - name: Upload distribution
        uses: actions/upload-artifact@v6
        with:
          name: distribution
          path: dist/

  verify-wheel:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download distribution
        uses: actions/download-artifact@v7
        with:
          name: distribution
          path: dist/

      - name: Install the built wheel into a clean environment
        run: |
          python -m venv /tmp/inferrail-release-check
          /tmp/inferrail-release-check/bin/pip install "$(ls dist/*.whl)"

      - name: Run the documented AP quickstart against the installed wheel
        working-directory: /tmp
        run: |
          /tmp/inferrail-release-check/bin/inferrail ap demo
          /tmp/inferrail-release-check/bin/inferrail ap report --db inferrail-ap-demo.sqlite3 --json | python3 -m json.tool > /dev/null
          /tmp/inferrail-release-check/bin/inferrail --help
          /tmp/inferrail-release-check/bin/python3 -c "import inferrail; print('version:', inferrail.__version__)"
          /tmp/inferrail-release-check/bin/python3 -c "import inferrail.ap; print(sorted(inferrail.ap.__all__))"

      - name: Confirm the installed wheel discovers its own bundled dashboard
        working-directory: /tmp
        run: |
          /tmp/inferrail-release-check/bin/python3 -c "
          from inferrail.dashboard import find_dashboard_dist
          found = find_dashboard_dist()
          assert found is not None and (found / 'index.html').is_file(), found
          print('ok: installed wheel discovers its own bundled dashboard at', found)
          "

  publish:
    needs: [ci, build, verify-wheel, platform-verify]
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - name: Download distribution
        uses: actions/download-artifact@v7
        with:
          name: distribution
          path: dist/

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  mcp-registry:
    # Publishes server.json to the official MCP Registry, only after the
    # PyPI release above succeeded (the registry verifies that the PyPI
    # package version exists and its README carries the matching
    # `mcp-name` marker). Authenticates with GitHub OIDC, the registry's
    # documented CI method for io.github.domondi1/* names: no stored
    # secret. Runs only on v*.*.* tags (see `on:` above).
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: "1.8.1"
      MCP_PUBLISHER_SHA256: "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc"
    steps:
      - uses: actions/checkout@v5

      - name: Confirm server.json version matches the release tag
        run: |
          expected="${GITHUB_REF_NAME#v}"
          python3 -c "
          import json, sys
          s = json.load(open('server.json'))
          versions = {s['version'], *(p['version'] for p in s['packages'])}
          assert versions == {sys.argv[1]}, f'server.json versions {versions} != tag {sys.argv[1]}'
          print('ok: server.json version', sys.argv[1])
          " "$expected"

      - name: Install mcp-publisher (pinned, checksum-verified)
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher

      - name: Validate server.json
        run: ./mcp-publisher validate

      - name: Authenticate to the MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json to the MCP Registry
        run: ./mcp-publisher publish
