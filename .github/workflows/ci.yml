name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    # Lets publish.yml gate a release on this exact workflow succeeding
    # for the tagged commit, instead of just bumping a version number.

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev dependencies
        run: pip install -e ".[dev,mcp]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type-check (mypy)
        run: mypy

      - name: Test (pytest, no external credentials required)
        run: pytest

      - name: Check openapi.json is up to date
        run: |
          python scripts/generate_openapi.py
          git diff --exit-code openapi.json

      - name: Check config.schema.json is up to date
        run: |
          python scripts/generate_config_schema.py
          git diff --exit-code config.schema.json

      - name: Check ERRORS.md is up to date
        run: |
          python scripts/generate_errors_md.py
          git diff --exit-code ERRORS.md

  hosted-economic-authority:
    # Dedicated, required job for hosted/a2a_economic_authority/: the main
    # `test` job above only installs `[dev,mcp]`, so its transport tests
    # self-skip (pytest.importorskip("a2a")) exactly like
    # hosted/work_economics/'s cdp-sdk/x402 tests already do -- a skipped
    # transport suite proves nothing. This job installs `[hosted]` (which
    # includes a2a-sdk) so the real A2A transport suite actually runs, and
    # type-checks the hosted module directly, since it is deliberately
    # excluded from the main `mypy` invocation's package list (see
    # docs/adr/0010 and pyproject.toml's `[tool.mypy]`).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package with dev and hosted dependencies
        run: pip install -e ".[dev,hosted]"

      - name: Lint (ruff) -- hosted/a2a_economic_authority
        run: ruff check hosted/a2a_economic_authority

      - name: Type-check (mypy) -- hosted/a2a_economic_authority
        run: mypy hosted/a2a_economic_authority --strict --ignore-missing-imports

      - name: Test -- Economic Authority core, capabilities, and real A2A transport
        shell: bash
        run: bash scripts/run_hosted_a2a_tests.sh

      - name: Boundary check (belt-and-suspenders alongside the dedicated job)
        run: bash scripts/check_no_internal_content.sh

  ap-exceptions:
    # Dedicated job for AP invoice-exception recovery: the main `test` job
    # only installs `[dev,mcp]`, so OpenAIRetryAdapter's `openai` import is
    # exercised only via the mypy override (see pyproject.toml), never
    # actually installed there. This job installs `[dev,ap]` so the real
    # `openai` package is present for both mypy and pytest, and also
    # lints/type-checks hosted/ap_exceptions/, which -- like
    # hosted/a2a_economic_authority -- is deliberately excluded from the
    # main `mypy` invocation's package list.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package with dev and ap dependencies
        run: pip install -e ".[dev,mcp,ap]"

      - name: Install hosted/ap_exceptions dependencies
        run: pip install -r hosted/ap_exceptions/requirements.txt

      - name: Lint (ruff) -- inferrail.ap, hosted/ap_exceptions, examples, tests
        run: |
          ruff check src/inferrail/ap hosted/ap_exceptions \
            examples/ap_invoice_exception_recovery tests/unit/ap \
            tests/unit/hosted/test_ap_exceptions_service.py \
            tests/integration/test_ap_openai_live.py \
            tests/integration/test_ap_crash_recovery.py

      - name: Type-check (mypy) -- inferrail.ap (with openai installed)
        run: mypy src/inferrail/ap --strict

      - name: Type-check (mypy) -- hosted/ap_exceptions
        run: mypy hosted/ap_exceptions --strict --ignore-missing-imports

      - name: Test -- AP unit, hosted-service, and crash-recovery tests
        run: |
          pytest tests/unit/ap tests/unit/hosted/test_ap_exceptions_service.py \
            tests/integration/test_ap_crash_recovery.py -v

  dashboard:
    # The dashboard (app/, docs/adr/0017) is a separate Node/TypeScript
    # project -- kept as its own job so a Node toolchain is never a
    # dependency of the Python package's own CI (the `test` job above).
    # Also verifies the built output is actually discoverable by the
    # backend, the same integration point test_dashboard.py's env-override
    # tests exercise directly.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package (for the discovery-integration check below)
        run: pip install -e .

      - name: Install dashboard dependencies
        working-directory: app
        run: npm ci

      - name: Type-check
        working-directory: app
        run: npm run lint

      - name: Test (vitest)
        working-directory: app
        run: npm test

      - name: Build
        working-directory: app
        run: npm run build

      - name: Verify the Python backend can find the built dashboard
        run: |
          test -f app/dist/index.html
          python scripts/check_dashboard_discoverable.py
