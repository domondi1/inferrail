name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    # Lets publish.yml gate a release on this exact workflow succeeding
    # for the tagged commit, instead of just bumping a version number.

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev dependencies
        run: pip install -e ".[dev,mcp]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type-check (mypy)
        run: mypy

      - name: Test (pytest, no external credentials required)
        run: pytest

      - name: Check openapi.json is up to date
        run: |
          python scripts/generate_openapi.py
          git diff --exit-code openapi.json

      - name: Check config.schema.json is up to date
        run: |
          python scripts/generate_config_schema.py
          git diff --exit-code config.schema.json

      - name: Check ERRORS.md is up to date
        run: |
          python scripts/generate_errors_md.py
          git diff --exit-code ERRORS.md

  hosted-economic-authority:
    # Dedicated, required job for hosted/a2a_economic_authority/: the main
    # `test` job above only installs `[dev,mcp]`, so its transport tests
    # self-skip (pytest.importorskip("a2a")) exactly like
    # hosted/work_economics/'s cdp-sdk/x402 tests already do -- a skipped
    # transport suite proves nothing. This job installs `[hosted]` (which
    # includes a2a-sdk) so the real A2A transport suite actually runs, and
    # type-checks the hosted module directly, since it is deliberately
    # excluded from the main `mypy` invocation's package list (see
    # docs/adr/0010 and pyproject.toml's `[tool.mypy]`).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package with dev and hosted dependencies
        run: pip install -e ".[dev,hosted]"

      - name: Lint (ruff) -- hosted/a2a_economic_authority
        run: ruff check hosted/a2a_economic_authority

      - name: Type-check (mypy) -- hosted/a2a_economic_authority
        run: mypy hosted/a2a_economic_authority --strict --ignore-missing-imports

      - name: Test -- Economic Authority core, capabilities, and real A2A transport
        shell: bash
        run: bash scripts/run_hosted_a2a_tests.sh

      - name: Boundary check (belt-and-suspenders alongside the dedicated job)
        run: bash scripts/check_no_internal_content.sh

  ap-exceptions:
    # Dedicated job for AP invoice-exception recovery: the main `test` job
    # only installs `[dev,mcp]`, so OpenAIRetryAdapter's `openai` import is
    # exercised only via the mypy override (see pyproject.toml), never
    # actually installed there. This job installs `[dev,ap]` so the real
    # `openai` package is present for both mypy and pytest, and also
    # lints/type-checks hosted/ap_exceptions/, which -- like
    # hosted/a2a_economic_authority -- is deliberately excluded from the
    # main `mypy` invocation's package list.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package with dev and ap dependencies
        run: pip install -e ".[dev,mcp,ap]"

      - name: Install hosted/ap_exceptions dependencies
        run: pip install -r hosted/ap_exceptions/requirements.txt

      - name: Lint (ruff) -- inferrail.ap, hosted/ap_exceptions, examples, tests
        run: |
          ruff check src/inferrail/ap hosted/ap_exceptions \
            examples/ap_invoice_exception_recovery tests/unit/ap \
            tests/unit/hosted/test_ap_exceptions_service.py \
            tests/integration/test_ap_openai_live.py \
            tests/integration/test_ap_crash_recovery.py

      - name: Type-check (mypy) -- inferrail.ap (with openai installed)
        run: mypy src/inferrail/ap --strict

      - name: Type-check (mypy) -- hosted/ap_exceptions
        run: mypy hosted/ap_exceptions --strict --ignore-missing-imports

      - name: Test -- AP unit, hosted-service, and crash-recovery tests
        run: |
          pytest tests/unit/ap tests/unit/hosted/test_ap_exceptions_service.py \
            tests/integration/test_ap_crash_recovery.py -v

  cost-gateway:
    # Dedicated job for the hosted Cost Gateway (self-serve trial), same
    # reasoning as the `ap-exceptions` job above: lints/type-checks
    # hosted/cost_gateway/, which is deliberately excluded from the main
    # `mypy` invocation's package list, same as every other `hosted/*`
    # service.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package with dev dependencies
        run: pip install -e ".[dev,mcp]"

      - name: Install hosted/cost_gateway dependencies
        run: pip install -r hosted/cost_gateway/requirements.txt

      - name: Lint (ruff) -- hosted/cost_gateway, tests
        run: |
          ruff check hosted/cost_gateway tests/unit/hosted/test_cost_gateway_service.py

      - name: Type-check (mypy) -- hosted/cost_gateway
        run: mypy hosted/cost_gateway --strict --ignore-missing-imports

      - name: Test -- Cost Gateway hosted-service tests
        run: pytest tests/unit/hosted/test_cost_gateway_service.py -v

  usage-ping-collector:
    # hosted/usage_ping/ (docs/adr/0019) has zero dependency on the
    # `inferrail` package, so its tests already run in the main `test`
    # job above for free -- this job exists only to lint/type-check the
    # collector itself, which -- like hosted/ap_exceptions and
    # hosted/a2a_economic_authority -- is deliberately excluded from the
    # main `mypy` invocation's package list.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install hosted/usage_ping dependencies
        # This job doesn't install the `inferrail` package at all --
        # hosted/usage_ping has zero dependency on it (see service.py's
        # own docstring) -- so ruff/mypy are installed directly rather
        # than via the `dev` extra.
        run: pip install -r hosted/usage_ping/requirements.txt "ruff>=0.4" "mypy>=1.9"

      - name: Lint (ruff) -- hosted/usage_ping
        run: ruff check hosted/usage_ping tests/unit/hosted/test_usage_ping_service.py

      - name: Type-check (mypy) -- hosted/usage_ping
        run: mypy hosted/usage_ping --strict --ignore-missing-imports

  dashboard:
    # The dashboard (app/, docs/adr/0017) is a separate Node/TypeScript
    # project -- kept as its own job so a Node toolchain is never a
    # dependency of the Python package's own CI (the `test` job above).
    # Also verifies the built output is actually discoverable by the
    # backend, the same integration point test_dashboard.py's env-override
    # tests exercise directly.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package (for the discovery-integration check below)
        run: pip install -e .

      - name: Install dashboard dependencies
        working-directory: app
        run: npm ci

      - name: Type-check
        working-directory: app
        run: npm run lint

      - name: Test (vitest)
        working-directory: app
        run: npm test

      - name: Build
        working-directory: app
        run: npm run build

      - name: Verify the Python backend can find the built dashboard
        run: |
          test -f app/dist/index.html
          python scripts/check_dashboard_discoverable.py

      - name: Build a real wheel and verify it bundles the dashboard
        # Exercises hatch_build.py for real (Node is already set up on
        # this job) rather than only its mocked-npm unit tests
        # (tests/unit/test_hatch_build.py) -- the actual point of this
        # check is proving a real `pip install inferrail` wheel ships a
        # working dashboard, closing docs/adr/0017's "Known gap".
        run: |
          rm -rf app/dist src/inferrail/dashboard_static dist build
          pip install build
          python -m build --wheel
          python -c "
          import glob, zipfile
          whl = glob.glob('dist/*.whl')[0]
          names = zipfile.ZipFile(whl).namelist()
          assert 'inferrail/dashboard_static/index.html' in names, names
          print('ok: wheel bundles the dashboard:', whl)
          "

      - name: Install the built wheel into a clean venv and confirm discovery
        run: |
          python -m venv /tmp/inferrail-dashboard-wheel-check
          /tmp/inferrail-dashboard-wheel-check/bin/pip install dist/*.whl
          /tmp/inferrail-dashboard-wheel-check/bin/python -c "
          from inferrail.dashboard import find_dashboard_dist
          found = find_dashboard_dist()
          assert found is not None and (found / 'index.html').is_file(), found
          print('ok: installed wheel discovers its own bundled dashboard at', found)
          "

  mcp-registry-metadata:
    # Validates server.json (the official MCP Registry entry) with the
    # official mcp-publisher CLI, pinned and checksum-verified. `validate`
    # needs no credentials and publishes nothing; publishing happens only
    # from publish.yml on a release tag.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MCP_PUBLISHER_VERSION: "1.8.1"
      MCP_PUBLISHER_SHA256: "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc"
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher (pinned, checksum-verified)
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher

      - name: Validate server.json
        run: ./mcp-publisher validate
