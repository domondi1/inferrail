name: Platform Verify

# Native Windows/macOS/Linux verification of the built, installed
# package -- an Ubuntu container proves nothing about Windows or macOS
# support (different filesystem/locking semantics, different shells,
# different executable layout in a venv). This workflow builds the wheel
# once per OS and installs it into a clean venv *outside* the checkout,
# then runs the documented AP quickstart, the local integration example,
# and the persistence/crash-recovery test suite against that installed
# package -- not against an editable `src/` checkout.
#
# PR-gating (not just release-gating like publish.yml's own verify-wheel
# job): catching a platform-specific break (e.g. SQLite `BEGIN IMMEDIATE`
# locking behaving differently on Windows, or a PowerShell quoting
# issue in the documented commands) before a release is tagged is the
# whole point -- discovering it only at tag-push time is too late to fix
# without re-tagging.

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  wheel-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      # Required so hatch_build.py's wheel-build hook (docs/adr/0018) can
      # bundle the dashboard on every OS this workflow verifies, not just
      # ci.yml's own Ubuntu-only `dashboard` job -- setup-node is
      # cross-platform (works on windows-latest/macos-latest too), so one
      # step covers the whole matrix.
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build wheel
        # Explicit shell: bash (Git Bash, available on windows-latest too)
        # rather than the implicit per-OS default -- GitHub Actions
        # defaults to pwsh on Windows runners when no shell is given, and
        # pwsh does not treat a failing native command as a terminating
        # error on its own (see the Windows steps below for the
        # $LASTEXITCODE pattern this avoids needing here).
        shell: bash
        run: |
          python -m pip install build
          python -m build --wheel

      - name: Confirm the built wheel bundles the dashboard
        # One shell works for all three OSes here (see the Build wheel
        # step's own comment on why bash) -- catches a per-OS npm/hook
        # failure (e.g. a Windows path-length or shell-quoting issue in
        # hatch_build.py) that ci.yml's Ubuntu-only `dashboard` job could
        # never see.
        shell: bash
        run: |
          python3 -c "
          import zipfile, glob
          whl = glob.glob('dist/*.whl')[0]
          names = zipfile.ZipFile(whl).namelist()
          assert any(n.endswith('dashboard_static/index.html') for n in names), (
              f'{whl} does not bundle the dashboard on this OS -- refusing to pass.'
          )
          print('ok: wheel bundles the dashboard:', whl)
          "

      - name: Create a clean venv outside the checkout (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: python3 -m venv "$RUNNER_TEMP/inferrail-platform-check"

      - name: Create a clean venv outside the checkout (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m venv "$env:RUNNER_TEMP\inferrail-platform-check"
          if ($LASTEXITCODE -ne 0) { throw "venv creation failed with exit code $LASTEXITCODE" }

      - name: Install the built wheel + [ap,dev] extras (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          whl=$(ls dist/*.whl)
          "$RUNNER_TEMP/inferrail-platform-check/bin/pip" install "${whl}[ap,dev]"
          "$RUNNER_TEMP/inferrail-platform-check/bin/pip" install -r hosted/ap_exceptions/requirements.txt

      - name: Install the built wheel + [ap,dev] extras (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # PowerShell does NOT treat a non-zero exit code from a native
          # .exe as a terminating error on its own -- $ErrorActionPreference
          # only governs PowerShell's own cmdlet/script errors. Every
          # native invocation in this workflow is followed by an explicit
          # $LASTEXITCODE check so a failing command actually fails the step,
          # instead of the script silently continuing (and the job passing
          # even though e.g. `inferrail ap demo` errored).
          function Assert-Success($label) {
            if ($LASTEXITCODE -ne 0) { throw "$label failed with exit code $LASTEXITCODE" }
          }
          $pip = "$env:RUNNER_TEMP\inferrail-platform-check\Scripts\pip.exe"
          $whl = (Get-ChildItem dist\*.whl | Select-Object -First 1).FullName
          & $pip install "$whl[ap,dev]"
          Assert-Success "pip install (wheel)"
          & $pip install -r hosted\ap_exceptions\requirements.txt
          Assert-Success "pip install (hosted requirements)"

      - name: Confirm version and imports, from outside the checkout (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          py="$RUNNER_TEMP/inferrail-platform-check/bin/python3"
          "$py" -c "import inferrail; print('version:', inferrail.__version__)"
          "$py" -c "import inferrail.ap; print('ap.__all__:', sorted(inferrail.ap.__all__))"
          "$py" -c "
          from inferrail.dashboard import find_dashboard_dist
          found = find_dashboard_dist()
          assert found is not None and (found / 'index.html').is_file(), found
          print('ok: installed wheel discovers its own bundled dashboard at', found)
          "

      - name: Confirm version and imports, from outside the checkout (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          $ErrorActionPreference = "Stop"
          function Assert-Success($label) {
            if ($LASTEXITCODE -ne 0) { throw "$label failed with exit code $LASTEXITCODE" }
          }
          $py = "$env:RUNNER_TEMP\inferrail-platform-check\Scripts\python.exe"
          & $py -c "import inferrail; print('version:', inferrail.__version__)"
          Assert-Success "import inferrail"
          & $py -c "import inferrail.ap; print('ap.__all__:', sorted(inferrail.ap.__all__))"
          Assert-Success "import inferrail.ap"
          & $py -c "
          from inferrail.dashboard import find_dashboard_dist
          found = find_dashboard_dist()
          assert found is not None and (found / 'index.html').is_file(), found
          print('ok: installed wheel discovers its own bundled dashboard at', found)
          "
          Assert-Success "dashboard discovery"

      - name: Run the documented AP demo + report, from outside the checkout (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          bin="$RUNNER_TEMP/inferrail-platform-check/bin"
          "$bin/inferrail" ap demo
          "$bin/inferrail" ap report --db inferrail-ap-demo.sqlite3 --json | "$bin/python3" -m json.tool

      - name: Run the documented AP demo + report, from outside the checkout (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          $ErrorActionPreference = "Stop"
          function Assert-Success($label) {
            if ($LASTEXITCODE -ne 0) { throw "$label failed with exit code $LASTEXITCODE" }
          }
          $bin = "$env:RUNNER_TEMP\inferrail-platform-check\Scripts"
          & "$bin\inferrail.exe" ap demo
          Assert-Success "inferrail ap demo"
          $reportJson = & "$bin\inferrail.exe" ap report --db inferrail-ap-demo.sqlite3 --json
          Assert-Success "inferrail ap report"
          $reportJson | & "$bin\python.exe" -m json.tool
          Assert-Success "json.tool"

      - name: Run the local integration example against the installed wheel (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/inferrail-platform-check/bin/python3" \
            "$GITHUB_WORKSPACE/examples/ap_invoice_exception_recovery/custom_integration_example.py"

      - name: Run the local integration example against the installed wheel (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          $ErrorActionPreference = "Stop"
          function Assert-Success($label) {
            if ($LASTEXITCODE -ne 0) { throw "$label failed with exit code $LASTEXITCODE" }
          }
          $py = "$env:RUNNER_TEMP\inferrail-platform-check\Scripts\python.exe"
          $example = "$env:GITHUB_WORKSPACE\examples\ap_invoice_exception_recovery\custom_integration_example.py"
          & $py $example
          Assert-Success "custom_integration_example.py"

      - name: Run the hosted API client against a locally started instance (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          bin="$RUNNER_TEMP/inferrail-platform-check/bin"
          AP_API_KEYS=platform-verify-key "$bin/python3" \
            "$GITHUB_WORKSPACE/hosted/ap_exceptions/service.py" ./ap-data 8422 &
          server_pid=$!
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8422/health > /dev/null && break
            sleep 0.5
          done
          "$bin/python3" "$GITHUB_WORKSPACE/examples/ap_invoice_exception_recovery/hosted_client_example.py" \
            --base-url http://127.0.0.1:8422 --api-key platform-verify-key --work-id PLATFORM-VERIFY-1
          kill "$server_pid"

      - name: Run the hosted API client against a locally started instance (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          $ErrorActionPreference = "Stop"
          function Assert-Success($label) {
            if ($LASTEXITCODE -ne 0) { throw "$label failed with exit code $LASTEXITCODE" }
          }
          $py = "$env:RUNNER_TEMP\inferrail-platform-check\Scripts\python.exe"
          $service = "$env:GITHUB_WORKSPACE\hosted\ap_exceptions\service.py"
          $client = "$env:GITHUB_WORKSPACE\examples\ap_invoice_exception_recovery\hosted_client_example.py"
          $env:AP_API_KEYS = "platform-verify-key"
          $serviceArgs = @($service, ".\ap-data", "8422")
          $proc = Start-Process -FilePath $py -ArgumentList $serviceArgs -PassThru -NoNewWindow
          $ready = $false
          for ($i = 0; $i -lt 30; $i++) {
            try {
              Invoke-WebRequest -Uri http://127.0.0.1:8422/health -UseBasicParsing | Out-Null
              $ready = $true
              break
            } catch { Start-Sleep -Milliseconds 500 }
          }
          if (-not $ready) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            throw "hosted service never became healthy"
          }
          $clientArgs = @(
            $client, "--base-url", "http://127.0.0.1:8422",
            "--api-key", "platform-verify-key", "--work-id", "PLATFORM-VERIFY-1"
          )
          & $py $clientArgs
          $clientExitCode = $LASTEXITCODE
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          if ($clientExitCode -ne 0) {
            throw "hosted_client_example.py failed with exit code $clientExitCode"
          }

      - name: Run persistence/crash-recovery tests against the installed wheel (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          "$RUNNER_TEMP/inferrail-platform-check/bin/pytest" \
            tests/unit/ap/test_store.py tests/integration/test_ap_crash_recovery.py -v

      - name: Run persistence/crash-recovery tests against the installed wheel (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pytest = "$env:RUNNER_TEMP\inferrail-platform-check\Scripts\pytest.exe"
          & $pytest tests\unit\ap\test_store.py tests\integration\test_ap_crash_recovery.py -v
          if ($LASTEXITCODE -ne 0) { throw "pytest failed with exit code $LASTEXITCODE" }
