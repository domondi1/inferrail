name: Pricing sync

# Weekly: regenerate src/inferrail/pricing/vendor_snapshot.json from OpenAI's and Anthropic's own
# pricing pages. When anything changed (a new model priced, a price changed, a model no longer
# priced), open a pull request; a price reaches budget enforcement only after it is reviewed and
# merged. Rows the price schema can't express exactly stay unpriced (see
# src/inferrail/pricing/vendor_pages.py), and a page that can't be read or parsed changes nothing.

on:
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet -e .
      - name: Regenerate the snapshot
        id: sync
        run: |
          set +e
          python scripts/sync_vendor_pricing.py --write | tee sync.txt
          echo "rc=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - name: Fail on an unreadable page
        if: steps.sync.outputs.rc == '2'
        run: exit 1
      - name: Test the new snapshot
        if: steps.sync.outputs.rc == '1'
        run: |
          python -m pip install --quiet pytest
          python -m pytest -q tests/unit/test_vendor_pricing.py tests/unit/test_pricing.py
      - name: Open a pull request
        if: steps.sync.outputs.rc == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="pricing-sync/$(date -u +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add src/inferrail/pricing/vendor_snapshot.json
          git commit -m "pricing: sync from the vendors' pricing pages"
          git push origin "$branch"
          gh pr create --title "pricing: sync from the vendors' pricing pages ($(date -u +%Y-%m-%d))" \
            --body "$(printf 'Regenerated by the weekly pricing sync from the vendors'"'"' own pricing pages.\n\n```\n%s\n```\n\nReview the changed prices before merging: merged prices are used for budget enforcement.' "$(cat sync.txt)")"
