[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inferrail"
version = "0.1.0"
description = "Self-hosted, OpenAI-compatible LLM gateway with per-request cost attribution and payload-free receipts."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Inferrail contributors" }]
keywords = [
    "llm",
    "openai",
    "llm-gateway",
    "openai-compatible",
    "inference-gateway",
    "cost-attribution",
    "cost-tracking",
    "llm-observability",
    "self-hosted",
    "developer-tools",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.urls]
Repository = "https://github.com/domondi1/inferrail"
Issues = "https://github.com/domondi1/inferrail/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.9",
    "types-PyYAML",
]
mcp = [
    "mcp>=1.0",
]

[project.scripts]
inferrail = "inferrail.cli.main:main"
inferrail-mcp = "inferrail_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/inferrail", "inferrail-mcp/src/inferrail_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires real, explicitly-provided provider credentials",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
packages = ["inferrail", "inferrail_mcp"]
mypy_path = "src:inferrail-mcp/src"
strict = true
disallow_untyped_defs = true
warn_unused_ignores = true
