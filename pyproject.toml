[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inferrail"
version = "0.1.0"
description = "Open inference control plane: an OpenAI-compatible gateway for routing, observing, and measuring AI inference."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "UNLICENSED" }
authors = [{ name = "Inferrail contributors" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.9",
    "types-PyYAML",
]

[project.scripts]
inferrail = "inferrail.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/inferrail"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires real, explicitly-provided provider credentials",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
packages = ["inferrail"]
mypy_path = "src"
strict = true
disallow_untyped_defs = true
warn_unused_ignores = true
