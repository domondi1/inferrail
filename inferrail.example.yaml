# yaml-language-server: $schema=./config.schema.json
#
# Copy to inferrail.yaml and adjust. inferrail.yaml is gitignored by default
# since real deployments often add environment-specific detail here.
#
# Secrets are never stored in this file — only the *name* of the
# environment variable that holds each secret.
#
# config.schema.json (generated from InferrailConfig, see
# scripts/generate_config_schema.py) is a real JSON Schema an editor or
# agent can validate against, or generate a config from directly, without
# reading this comment.

providers:
  openai:
    type: openai
    api_key_env: OPENAI_API_KEY
    # base_url: https://api.openai.com/v1   # override to point at any
                                             # OpenAI-compatible endpoint

routes:
  # A route is what clients select via the "model" field of a
  # /v1/chat/completions request, e.g. {"model": "default", ...}.
  # Multiple routes can exist side by side, pointing at the same or
  # different providers/models/retry policies.
  default:
    provider: openai
    model: gpt-4o-mini
    max_retries: 1
    timeout_seconds: 30

  fast:
    provider: openai
    model: gpt-4o-mini
    max_retries: 0
    timeout_seconds: 10

telemetry:
  sink: console   # console | jsonl | none
  # path: ./inferrail-telemetry.jsonl   # required when sink is "jsonl"

# Economic receipts: one payload-free record per request (provider, model,
# tokens, Decimal cost, pricing provenance, business attribution). See
# README.md's "Cost and attribution" section and `inferrail report`.
receipts:
  sink: jsonl     # jsonl | none
  path: ./inferrail-receipts.jsonl

# Optional: add or override a per-model price. The built-in catalog
# already covers a couple of real, independently-verified OpenAI models
# (see src/inferrail/pricing/builtin.py) for providers with `type: openai`
# and no custom base_url. Use this section for any other model, or to
# correct a stale built-in price. `source` and `verified_date` are
# required — Inferrail never persists a price it can't explain.
# pricing:
#   openai:
#     gpt-4o-mini:
#       input_usd_per_million: "0.15"
#       output_usd_per_million: "0.60"
#       source: "https://developers.openai.com/api/docs/pricing"
#       verified_date: "2026-08-16"

server:
  host: 127.0.0.1
  port: 8000
