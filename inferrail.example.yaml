# yaml-language-server: $schema=./config.schema.json
#
# Copy to inferrail.yaml and adjust. inferrail.yaml is gitignored by default
# since real deployments often add environment-specific detail here.
#
# Secrets are never stored in this file — only the *name* of the
# environment variable that holds each secret.
#
# config.schema.json (generated from InferrailConfig, see
# scripts/generate_config_schema.py) is a real JSON Schema an editor or
# agent can validate against, or generate a config from directly, without
# reading this comment.

providers:
  openai:
    type: openai
    api_key_env: OPENAI_API_KEY
    # base_url: https://api.openai.com/v1   # override to point at any
                                             # OpenAI-compatible endpoint

  # Optional: only needed to use POST /v1/messages (Anthropic-compatible
  # passthrough — see docs/adr/0014-anthropic-messages-passthrough.md).
  # Point an Anthropic SDK client at http://127.0.0.1:8000 with this
  # configured and ANTHROPIC_API_KEY set.
  # anthropic:
  #   type: anthropic
  #   api_key_env: ANTHROPIC_API_KEY
  #   # base_url: https://api.anthropic.com/v1   # override to point at any
  #                                               # Anthropic-compatible endpoint

# Requests choose their own model: whatever model id a client sends is
# passed through unchanged to this provider (e.g. {"model": "<model id>"}
# reaches OpenAI as that model). Inferrail never picks a model for you;
# `inferrail models` lists the ones your account can use and which have a
# price (needed under a dollar budget). See
# docs/adr/0007-model-passthrough-routing.md and
# docs/adr/0024-the-user-chooses-the-model.md.
default_provider: openai

# Optional named routes: aliases that pin a model and a retry policy, e.g.
# so clients can send {"model": "fast"}. Named routes take priority over
# pass-through. One routes: section serves both wire formats; which one a
# route is reachable from depends on which provider it names.
# routes:
#   fast:
#     provider: openai
#     model: <model id>
#     max_retries: 0
#     timeout_seconds: 10
#   claude:
#     provider: anthropic
#     model: <model id>
#     max_retries: 1
#     timeout_seconds: 30

telemetry:
  sink: console   # console | jsonl | none
  # path: ./inferrail-telemetry.jsonl   # required when sink is "jsonl"

# Economic receipts: one payload-free record per request (provider, model,
# tokens, Decimal cost, pricing provenance, business attribution). See
# docs/integrations.md's "Attribution" section and `inferrail report`.
receipts:
  sink: jsonl     # jsonl | sqlite | none
  path: ./inferrail-receipts.jsonl
  # sqlite gets you indexed queries (ts/work_id/project/model) and a
  # bounded file instead of an ever-growing text file; `inferrail report`/
  # `transaction`/`work` work unchanged against either. Switch with:
  #   sink: sqlite
  #   path: ./inferrail-receipts.sqlite3
  # `inferrail receipts import --jsonl <old> --db <new>` moves existing
  # JSONL history over; `inferrail receipts export` goes the other way.

# Optional: add or override a per-model price. The built-in catalog
# already covers a couple of real, independently-verified OpenAI models
# (see src/inferrail/pricing/builtin.py) for providers with `type: openai`
# and no custom base_url. Use this section for any other model, or to
# correct a stale built-in price. `source` and `verified_date` are
# required — Inferrail never persists a price it can't explain.
# pricing:
#   openai:
#     gpt-4o-mini:
#       input_usd_per_million: "0.15"
#       output_usd_per_million: "0.60"
#       source: "https://developers.openai.com/api/docs/pricing"
#       verified_date: "2026-08-16"

# Optional: real, pre-flight-enforced spend caps. Off by default. See
# docs/adr/0015-budget-enforcement.md. Manage the actual budgets (scope,
# window, mode, limit) with `inferrail budget set|list|rm` — this
# section only says where that store lives and whether it's enforced.
# budgets:
#   enabled: true       # requires receipts.sink: sqlite above
#   path: ./inferrail-budgets.db

# Optional: the anonymous, opt-out usage/presence beacon. On by default
# (enabled: true), but still inert with no endpoint configured below —
# Inferrail ships with no built-in default endpoint, so nothing is ever
# sent unless you set `endpoint` yourself. See
# docs/adr/0020-quickstart-both-sdks-and-payload-free-verification.md and
# docs/privacy/usage-ping.md for exactly what this sends (four lifecycle
# events only, never a prompt, response, model name, cost, or anything
# about your traffic); preview the exact payload locally with
# `inferrail telemetry preview`. Turn it off with
# `inferrail telemetry disable`, `INFERRAIL_TELEMETRY=0`,
# `serve --no-telemetry`, or `DO_NOT_TRACK=1` (automatic under CI/tests).
# Under `inferrail serve`, `enabled` only seeds the dashboard Settings
# toggle's *first* value — the toggle (or `inferrail telemetry
# enable|disable`) owns it after that.
# usage_ping:
#   enabled: true
#   endpoint: https://your-own-collector.example/ping

server:
  host: 127.0.0.1
  port: 8000
